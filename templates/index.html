<!DOCTYPE html>
<html>
<head>
  <title>Login - WebShellX</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    input {
      padding: 8px;
      margin: 10px;
    }
    button {
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <h2>Login to WebShellX</h2>
  <form id="login-form">
    <input type="text" id="username" placeholder="Username" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>

  <p id="status"></p>
  <script src="static/index.js"></script>




</body>
</html>
